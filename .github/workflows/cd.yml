# Entrega continua de TechMind hacia Oracle Cloud Infrastructure.
#
# Flujo completo:
#
#   1. publicar-modelo  -> entrena y sube model.joblib a OCI Object Storage
#   2. publicar-imagenes-> construye y sube las imagenes a OCIR
#   3. desplegar        -> por SSH, actualiza los contenedores en OCI Compute
#   4. (si falla)       -> revierte automaticamente a la version anterior
#
# Se dispara al hacer push a main, o a mano desde la pestana Actions indicando
# una etiqueta concreta (que es como se hace un rollback deliberado).
#
# CONFIGURACION PREVIA: todos los secrets y variables que usa este archivo se
# crean siguiendo docs/devops/despliegue-oci.md. Sin ellos el workflow falla en
# el primer paso, a proposito y de forma ruidosa.

name: CD - Despliegue en OCI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Etiqueta a desplegar (vacio = el commit actual). Para revertir, poner el SHA de una version anterior.'
        required: false
        type: string

# Un solo despliegue a la vez. Sin esto, dos merges seguidos podrian escribir
# sobre la misma VM al mismo tiempo y dejarla en un estado imposible de razonar.
# `cancel-in-progress: false`: un despliegue a medias no se aborta, se termina.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

permissions:
  contents: read

env:
  # El SHA del commit como etiqueta de imagen. `latest` sirve para saber cual es
  # la ultima, pero no para saber QUE codigo esta corriendo ni para volver atras.
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:

  # =========================================================================
  # 0. Verificacion previa - nada se despliega sin pasar por aqui
  # =========================================================================
  verificar:
    name: Verificar antes de desplegar
    runs-on: ubuntu-latest

    # Este job repite parte de lo que ya hizo CI, y es a proposito. El workflow
    # de CI y este son INDEPENDIENTES: GitHub no encadena uno con otro por el
    # solo hecho de que ambos escuchen la rama main. Sin este job, un merge con
    # las pruebas en rojo llegaria igual a produccion, porque los jobs de
    # publicacion solo compilan, no prueban.
    #
    # Cuesta 2-3 minutos de runner. Desplegar una version rota a mitad de una
    # demo cuesta bastante mas.

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Pruebas del backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress verify

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements-dev.txt

      - name: Pruebas del servicio de inferencia
        working-directory: ml-service
        run: |
          pip install -r requirements-dev.txt
          ruff check app train tests
          python -m train.train
          pytest -q

  # =========================================================================
  # 1. Modelo -> OCI Object Storage
  # =========================================================================
  publicar-modelo:
    name: Publicar el modelo en Object Storage
    runs-on: ubuntu-latest
    needs: [verificar]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Instalar dependencias
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Entrenar el modelo
        working-directory: ml-service
        run: python -m train.train

      # La CLI de OCI se autentica con un archivo de configuracion y una clave
      # privada. Ambos se reconstruyen aqui desde los secrets del repositorio y
      # viven solo lo que dura el job, en un runner efimero.
      - name: Configurar credenciales de OCI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_CLI_KEY_CONTENT" > ~/.oci/key.pem
          # 600: la CLI de OCI se niega a usar una clave privada que sea legible
          # por otros usuarios, y con razon.
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=${HOME}/.oci/key.pem
          region=${OCI_CLI_REGION}
          EOF
          chmod 600 ~/.oci/config

      - name: Instalar la CLI de OCI
        run: pip install oci-cli==3.54.4

      - name: Subir el modelo al bucket
        env:
          BUCKET: ${{ vars.OCI_BUCKET_NAME }}
        run: |
          # Se sube dos veces: una con nombre versionado por SHA, que queda como
          # historial inmutable y permite volver a un modelo anterior; y otra
          # como model.joblib, que es el nombre fijo que lee el servicio.
          oci os object put \
            --bucket-name "$BUCKET" \
            --file ml-service/models/model.joblib \
            --name "modelos/model-${IMAGE_TAG}.joblib" \
            --force

          oci os object put \
            --bucket-name "$BUCKET" \
            --file ml-service/models/model.joblib \
            --name "model.joblib" \
            --force

          # Las metricas viajan junto al modelo: sin ellas, dentro de un mes
          # nadie podra decir que tan bueno era el modelo que estaba en produccion.
          oci os object put \
            --bucket-name "$BUCKET" \
            --file ml-service/models/metrics.json \
            --name "modelos/metrics-${IMAGE_TAG}.json" \
            --force

      - name: Resumen
        run: |
          echo "### Modelo publicado" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat ml-service/models/metrics.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # 2. Imagenes -> OCIR (Oracle Container Registry)
  # =========================================================================
  publicar-imagenes:
    name: Publicar imagenes en OCIR
    runs-on: ubuntu-latest
    needs: [verificar]

    strategy:
      # Las dos imagenes se construyen en paralelo, en runners distintos.
      matrix:
        servicio: [backend, ml-service]
      # fail-fast desactivado: si una falla, interesa ver tambien el resultado
      # de la otra en la misma corrida en vez de tener que relanzar.
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      # QEMU es OBLIGATORIO aqui. El runner de GitHub es x86_64 y la VM Always
      # Free de OCI es ARM (Ampere A1), asi que hay que construir para una
      # arquitectura distinta a la del runner. Sin este paso, el build para
      # linux/arm64 falla al ejecutar cualquier RUN del Dockerfile.
      #
      # Consecuencia a tener en cuenta: los pasos RUN corren emulados y son
      # lentos. En el ml-service, `pip install` es rapido porque descarga wheels
      # precompiladas para aarch64, pero el entrenamiento del modelo si se
      # ejecuta emulado y agrega un par de minutos al build.
      - name: Configurar QEMU (compilacion cruzada a ARM)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCIR_REGISTRY }}
          # El usuario de OCIR tiene la forma <namespace>/<usuario>, o
          # <namespace>/<dominio>/<usuario> si el tenancy usa identity domains.
          username: ${{ secrets.OCIR_USERNAME }}
          # NO es la contrasena de la consola: es un Auth Token generado en
          # Identity > Usuarios > Auth Tokens.
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: |
            ${{ vars.OCIR_REGISTRY }}/${{ vars.OCI_NAMESPACE }}/techmind/${{ matrix.servicio }}:${{ env.IMAGE_TAG }}
            ${{ vars.OCIR_REGISTRY }}/${{ vars.OCI_NAMESPACE }}/techmind/${{ matrix.servicio }}:latest
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
          # La VM Always Free de OCI es ARM (Ampere A1). Construir para amd64 y
          # desplegar en ARM produce el error "exec format error" al arrancar el
          # contenedor. Si la instancia fuera x86, cambiar por linux/amd64.
          platforms: ${{ vars.TARGET_PLATFORM || 'linux/arm64' }}

  # =========================================================================
  # 3. Despliegue en la VM
  # =========================================================================
  desplegar:
    name: Desplegar en OCI Compute
    runs-on: ubuntu-latest
    needs: [publicar-modelo, publicar-imagenes]

    # `environment` habilita, si se configura en los ajustes del repositorio,
    # exigir una aprobacion manual antes de tocar produccion.
    environment:
      name: produccion
      url: http://${{ vars.OCI_HOST }}:8080/swagger-ui/index.html

    steps:
      - uses: actions/checkout@v4

      - name: Preparar el acceso SSH
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          HOST: ${{ vars.OCI_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Se fija la huella del host en known_hosts. Sin esto habria que usar
          # StrictHostKeyChecking=no, que acepta cualquier servidor que responda
          # y deja el despliegue abierto a un ataque de intermediario.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar los archivos de compose a la VM
        env:
          HOST: ${{ vars.OCI_HOST }}
          USUARIO: ${{ vars.OCI_SSH_USER }}
        run: |
          # Solo viajan los archivos de orquestacion. El codigo fuente NO se
          # copia: lo que se despliega son las imagenes ya construidas y probadas
          # en CI, no una compilacion hecha en el servidor.
          #
          # El Caddyfile viaja siempre, aunque el perfil `https` este apagado:
          # cuesta 2 KB y evita el escenario de activar HTTPS en el .env y que el
          # despliegue falle porque el archivo de configuracion no esta.
          scp -i ~/.ssh/id_deploy \
            docker-compose.yml docker-compose.prod.yml \
            caddy/Caddyfile scripts/backup-datos.sh \
            "${USUARIO}@${HOST}:/opt/techmind/"

      - name: Desplegar
        env:
          HOST: ${{ vars.OCI_HOST }}
          USUARIO: ${{ vars.OCI_SSH_USER }}
          REGISTRY: ${{ vars.OCIR_REGISTRY }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy "${USUARIO}@${HOST}" \
            "REGISTRY='${REGISTRY}' \
             OCIR_USERNAME='${OCIR_USERNAME}' \
             OCIR_AUTH_TOKEN='${OCIR_AUTH_TOKEN}' \
             NUEVA_TAG='${IMAGE_TAG}' \
             bash -s" <<'GUION'
          set -euo pipefail
          cd /opt/techmind

          # La etiqueta actualmente desplegada se guarda antes de tocar nada:
          # es a donde se vuelve si el despliegue nuevo no supera el healthcheck.
          TAG_ANTERIOR=$(grep -E '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2- || echo "")
          echo "Version actual: ${TAG_ANTERIOR:-ninguna}"
          echo "Version nueva:  ${NUEVA_TAG}"

          echo "$OCIR_AUTH_TOKEN" | docker login "$REGISTRY" \
            --username "$OCIR_USERNAME" --password-stdin

          # sed sobre la linea IMAGE_TAG del .env de la VM, respetando el resto
          # de variables (credenciales de BD, API key) que solo existen ahi.
          if grep -qE '^IMAGE_TAG=' .env; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${NUEVA_TAG}|" .env
          else
            echo "IMAGE_TAG=${NUEVA_TAG}" >> .env
          fi

          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          $COMPOSE pull

          # --wait bloquea hasta que los healthchecks pasen; sin el, el comando
          # retornaria exito con los contenedores todavia arrancando y el
          # despliegue se declararia bueno sin haber comprobado nada.
          if $COMPOSE up -d --wait --wait-timeout 180; then
            echo "Despliegue correcto en la version ${NUEVA_TAG}"
          else
            echo "::error::Los healthchecks fallaron. Revirtiendo."
            $COMPOSE logs --no-color --tail=100

            if [ -n "$TAG_ANTERIOR" ]; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${TAG_ANTERIOR}|" .env
              $COMPOSE up -d --wait --wait-timeout 180
              echo "Revertido a ${TAG_ANTERIOR}"
            else
              echo "No hay version anterior a la que volver (primer despliegue)."
            fi
            exit 1
          fi

          # Las imagenes viejas se acumulan y llenan el disco de una VM chica.
          docker image prune --force --filter "until=168h"
          GUION

      - name: Verificar desde fuera de la VM
        env:
          HOST: ${{ vars.OCI_HOST }}
        run: |
          # Esta comprobacion se hace desde el runner y no por SSH a proposito:
          # confirma que el servicio es accesible a traves de la Security List y
          # del firewall, no solo desde dentro de la propia maquina.
          #
          # Se consulta /actuator/health y no una ruta funcional: cuando el
          # equipo implemente la autenticacion por API key, una ruta de negocio
          # devolveria 401 desde el runner y este paso fallaria un despliegue
          # que en realidad fue correcto.
          for intento in 1 2 3 4 5; do
            if curl --silent --fail --max-time 10 "http://${HOST}:8080/actuator/health" > /dev/null; then
              echo "La API responde publicamente."
              exit 0
            fi
            echo "Intento ${intento} sin exito, reintentando en 10s..."
            sleep 10
          done
          echo "::error::La API no responde desde el exterior. Revisar Security List y firewall de la instancia."
          exit 1

      - name: Resumen del despliegue
        if: always()
        run: |
          echo "### Despliegue" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Resultado: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Swagger: http://${{ vars.OCI_HOST }}:8080/swagger-ui/index.html" >> $GITHUB_STEP_SUMMARY
