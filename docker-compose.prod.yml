# TechMind - sobrescritura para PRODUCCION (OCI Compute).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Docker Compose fusiona ambos archivos: lo que esta aca reemplaza o agrega
# sobre docker-compose.yml. Se mantiene como archivo separado, y no como un
# compose de produccion independiente, para que la topologia de servicios este
# definida en un solo lugar y no pueda divergir entre entornos.
#
# REQUISITO: Docker Compose v2.24 o superior. Las etiquetas `!reset` que se usan
# mas abajo para anular claves del archivo base se incorporaron en esa version.
# Verificar en la VM con `docker compose version` antes del primer despliegue.
#
# Diferencias respecto a desarrollo:
#   - Se usan imagenes ya construidas y publicadas en OCIR (no se compila en la VM).
#   - El ml-service deja de publicar puerto: pasa a ser estrictamente interno.
#   - El modelo se descarga de OCI Object Storage en vez de viajar en la imagen.
#   - Se fijan limites de memoria y rotacion de logs.

name: techmind

services:

  ml-service:
    # `build` se anula: en la VM no hay codigo fuente ni conviene compilar.
    # Construir en produccion haria que el despliegue dependiera de la red y del
    # CPU de la instancia, y que la imagen desplegada no fuera bit a bit la
    # misma que se probo en CI.
    build: !reset null
    image: ${OCIR_REGISTRY}/${OCI_NAMESPACE}/techmind/ml-service:${IMAGE_TAG:-latest}

    environment:
      MODEL_SOURCE: oci
      MODEL_DIR: /app/models

      # instance_principal: la VM se autentica ante OCI con su propia identidad,
      # mediante un dynamic group y una policy. No hay claves privadas en disco
      # ni secretos que rotar, que es justamente lo que se quiere en un servidor.
      OCI_AUTH_METHOD: instance_principal
      OCI_NAMESPACE: ${OCI_NAMESPACE}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-techmind-models}
      OCI_REGION: ${OCI_REGION}

      # Los tres objetos deben existir en el bucket con estos nombres (o los
      # que se sobrescriban aca). Suben los .joblib tal cual los entrega
      # Ciencia de Datos, sin renombrar.
      OCI_OBJECT_CLASIFICADOR: ${OCI_OBJECT_CLASIFICADOR:-modelo_clasificador.joblib}
      OCI_OBJECT_TFIDF_TITULO: ${OCI_OBJECT_TFIDF_TITULO:-tfidf_titulo.joblib}
      OCI_OBJECT_TFIDF_TEXTO: ${OCI_OBJECT_TFIDF_TEXTO:-tfidf_texto.joblib}

      LOG_LEVEL: info

    # Anula la publicacion de puerto del archivo base. El ml-service solo debe
    # ser alcanzable por el backend a traves de la red interna; publicarlo en la
    # VM lo dejaria expuesto a Internet sin ninguna autenticacion delante.
    ports: !reset null

    volumes:
      # El modelo descargado persiste entre reinicios: si Object Storage no
      # responde en un reinicio, el servicio arranca igual con la ultima copia
      # buena en lugar de quedarse sin modelo.
      - ml-models:/app/models

    deploy:
      resources:
        limits:
          # scikit-learn y numpy cargados en memoria rondan los 300-400 MB. El
          # limite existe para que un pico en este servicio no deje sin memoria
          # a la JVM del backend en la misma VM.
          memory: 768M

    logging:
      driver: json-file
      options:
        # Sin rotacion, los logs crecen hasta llenar el disco de la instancia y
        # tumban todo el servidor. Es una de las formas mas comunes de perder
        # una VM pequena.
        max-size: "10m"
        max-file: "3"

  backend:
    build: !reset null
    image: ${OCIR_REGISTRY}/${OCI_NAMESPACE}/techmind/backend:${IMAGE_TAG:-latest}

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080

      INFERENCE_SERVICE_URL: http://ml-service:8000
      INFERENCE_SERVICE_TIMEOUT_MS: ${INFERENCE_SERVICE_TIMEOUT_MS:-8000}

      # El perfil prod declara ${DB_USERNAME} y ${DB_PASSWORD} SIN valor por
      # defecto, asi que ambas son obligatorias: si faltan, Spring no arranca.
      DB_USERNAME: ${DB_USERNAME:?falta DB_USERNAME en el .env de la VM}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env de la VM}
      DB_FILE_PATH: /app/data/techmind

      TECHMIND_API_KEY: ${TECHMIND_API_KEY:?falta TECHMIND_API_KEY en el .env de la VM}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    # `ports` NO se redeclara aca. El archivo base ya publica
    # "${BACKEND_PORT:-8080}:8080" y las secuencias de compose se FUSIONAN
    # concatenando: repetir la misma entrada no aporta nada y, segun la version
    # de compose, puede terminar en "port is already allocated".
    #
    # El backend es el unico servicio publico. Quien controla el acceso real es
    # la Security List de la VCN mas el firewall de la instancia; ver
    # docs/devops/despliegue-oci.md.

    deploy:
      resources:
        limits:
          memory: 768M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------------
  # Proxy inverso con HTTPS  (OPCIONAL)
  # -------------------------------------------------------------------------
  #
  # Este servicio esta detras de un `profile`, asi que POR DEFECTO NO ARRANCA.
  # Sin el, todo sigue funcionando exactamente igual por http://IP:8080.
  #
  # Para encenderlo, dos lineas en el .env de la VM:
  #
  #   COMPOSE_PROFILES=https
  #   TECHMIND_DOMINIO=techmind.140-238-1-2.sslip.io
  #
  # Compose lee COMPOSE_PROFILES del propio .env, de modo que activar HTTPS no
  # requiere tocar ni el workflow de despliegue ni ningun comando. Es una linea
  # en un archivo, y se apaga borrandola.
  #
  # ANTES de encenderlo hay que abrir 80 y 443 en la Security List de la VCN:
  #   terraform apply -var 'habilitar_https=true'
  # El 80 no es opcional: Let's Encrypt lo necesita para validar el dominio.
  caddy:
    image: caddy:2-alpine
    container_name: techmind-caddy
    profiles: ["https"]

    environment:
      # Valor por defecto, y NO la sintaxis `${VAR:?mensaje}` que se usa en el
      # resto del archivo.
      #
      # Compose interpola el archivo COMPLETO antes de filtrar por perfil, de
      # modo que un `:?` aca hace fallar `config` y `up` aunque el perfil https
      # este apagado. Es decir: rompería el despliegue normal y el paso de
      # validacion de CI, por una variable que en ese caso no se usa.
      #
      # Con `localhost` como respaldo, activar el perfil sin definir el dominio
      # levanta Caddy con un certificado interno en vez de pedirle uno a Let's
      # Encrypt para un nombre vacio. El error se ve en los logs de Caddy y no
      # consume ninguno de los cinco intentos semanales por dominio.
      TECHMIND_DOMINIO: ${TECHMIND_DOMINIO:-localhost}
      TECHMIND_EMAIL_TLS: ${TECHMIND_EMAIL_TLS:-}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados persisten entre reinicios. Sin esto, cada redespliegue
      # volveria a pedirlos, y Let's Encrypt limita a cinco por dominio por
      # semana: al sexto intento el sitio se queda sin certificado durante dias.
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - techmind-net

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ml-models:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
