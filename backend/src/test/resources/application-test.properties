# Perfil de test
# Deshabilita la integracion con OCI para que los tests no requieran ~/.oci/config.
# El perfil "test" se activa via @ActiveProfiles en cada test (no se puede definir
# spring.profiles.active dentro de un archivo de perfil especifico en Spring Boot 3).

# OCI deshabilitado en tests
techmind.oci.enabled=false

# Servicio de inferencia (no se invoca realmente en estos tests)
techmind.inference-service.base-url=http://localhost:8000
techmind.inference-service.timeout-ms=5000

# Gemini (no se invoca realmente en estos tests)
techmind.gemini.api-key=
techmind.gemini.model=gemini-3.6-flash
techmind.gemini.base-url=https://generativelanguage.googleapis.com
techmind.gemini.timeout-ms=5000

# Seguridad
techmind.security.api-key=

# Base de datos H2 embebida en memoria para tests
spring.datasource.url=jdbc:h2:mem:techmind-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false