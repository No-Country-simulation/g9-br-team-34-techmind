# Perfil de produccion

logging.level.root=INFO
logging.level.com.api.techmind_g9_team34=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Base de datos
spring.datasource.url=jdbc:h2:file:${DB_FILE_PATH:/app/data/techmind};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ddl-auto=update y no `validate`.
#
# `validate` exige que las tablas ya existan. En este despliegue la base H2 vive
# en un volumen que arranca VACIO la primera vez, asi que en cuanto el equipo
# anote @Entity en ContenidoAnalizado, Hibernate no encontraria la tabla, el
# contenedor quedaria unhealthy y el CD revertiria el despliegue.
#
# `update` crea el esquema en el primer arranque. Para un proyecto de mayor
# recorrido lo correcto seria Flyway o Liquibase con migraciones versionadas;
# `validate` recien tiene sentido a partir de ahi.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.api.techmind_g9_team34=INFO