# Perfil de desarrollo

logging.level.root=WARN
logging.level.com.api.techmind_g9_team34=DEBUG

# OCI deshabilitado por defecto en dev (no requiere ~/.oci/config).
# Para probar la integracion con OCI en local, definir OCI_ENABLED=true
# (o por propiedad del sistema -Dtechmind.oci.enabled=true) con credenciales validas.
techmind.oci.enabled=${OCI_ENABLED:false}

# Base de datos
spring.datasource.url=jdbc:h2:file:./data/techmind-dev;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.web=INFO