# Configuracion general de la aplicacion

spring.application.name=api-techmind

spring.profiles.active=dev

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Servidor
server.port=${SERVER_PORT:8080}
server.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Servicio de inferencia (Ciencia de Datos)
techmind.inference-service.base-url=${INFERENCE_SERVICE_URL:http://localhost:8000}
techmind.inference-service.timeout-ms=${INFERENCE_SERVICE_TIMEOUT_MS:5000}

# Actuator (agregado por DevOps)
#
# Se expone UNICAMENTE `health`. El resto de endpoints de actuator (env, beans,
# mappings, heapdump...) filtran configuracion interna y no se necesitan aca.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# El indicador de disco se apaga: marca DOWN cuando quedan menos de 10 MB
# libres. En una VM chica eso convertiria un disco lleno en un contenedor
# unhealthy y, por tanto, en un rollback automatico, cuando lo que hace falta es
# liberar espacio. El indicador de base de datos SI queda activo: si H2 no
# responde, la API no puede hacer su trabajo y el estado debe reflejarlo.
management.health.diskspace.enabled=false

# IMPORTANTE PARA EL EQUIPO DE BACKEND:
# cuando se implemente SecurityConfig / AuthenticationFilter, /actuator/health
# TIENE que quedar en permitAll(). Si empieza a devolver 401, el HEALTHCHECK de
# la imagen falla, el contenedor queda unhealthy y el despliegue se revierte
# solo, aunque la API funcione perfectamente.

# Seguridad
techmind.security.api-key=${TECHMIND_API_KEY:}

# OCI Object Storage
techmind.oci.auth-method=${OCI_AUTH_METHOD:config_file}
techmind.oci.namespace=${OCI_NAMESPACE:}
techmind.oci.bucket-name=${OCI_BUCKET_NAME:techmind-models}
techmind.oci.region=${OCI_REGION:}

# OCI - metodo config_file (usado si techmind.oci.auth-method=config_file)
techmind.oci.config-file=${OCI_CONFIG_FILE:~/.oci/config}
techmind.oci.config-profile=${OCI_CONFIG_PROFILE:DEFAULT}

# OCI - metodo env_vars (usado si techmind.oci.auth-method=env_vars)
techmind.oci.user-ocid=${OCI_USER_OCID:}
techmind.oci.tenancy-ocid=${OCI_TENANCY_OCID:}
techmind.oci.fingerprint=${OCI_FINGERPRINT:}
techmind.oci.private-key-path=${OCI_PRIVATE_KEY_PATH:}
techmind.oci.private-key-passphrase=${OCI_PRIVATE_KEY_PASSPHRASE:}