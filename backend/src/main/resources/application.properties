# Configuracion general de la aplicacion

spring.application.name=api-techmind

spring.profiles.active=dev

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Servidor
server.port=${SERVER_PORT:8080}
server.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Servicio de inferencia (Ciencia de Datos)
techmind.inference-service.base-url=${INFERENCE_SERVICE_URL:http://localhost:8000}
techmind.inference-service.timeout-ms=${INFERENCE_SERVICE_TIMEOUT_MS:5000}

# Seguridad
techmind.security.api-key=${TECHMIND_API_KEY:}

# OCI Object Storage
techmind.oci.namespace=${OCI_NAMESPACE:}
techmind.oci.bucket-name=${OCI_BUCKET_NAME:techmind-models}
techmind.oci.region=${OCI_REGION:}
techmind.oci.config-file=${OCI_CONFIG_FILE:~/.oci/config}
techmind.oci.config-profile=${OCI_CONFIG_PROFILE:DEFAULT}
